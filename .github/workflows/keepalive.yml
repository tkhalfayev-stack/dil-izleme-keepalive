name: keepalive
on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase (counts as DB activity)
        env:
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -s -o /tmp/out.txt -w "%{http_code}" \
            "https://tpstyphegagzxoomfphm.supabase.co/rest/v1/users?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "HTTP $code"; cat /tmp/out.txt; echo
          test "$code" = "200"
      - name: Keep repo active (avoid 60-day auto-disable)
        run: |
          date -u > last-run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last-run.txt
          git commit -m "keepalive $(date -u +%F)" || exit 0
          git push
